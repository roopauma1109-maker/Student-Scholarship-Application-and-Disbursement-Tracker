<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Tracker</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="container">

        <h1>🎓 Student Scholarship Application Tracker</h1>

        <div class="cards">

            <div class="card">
                <h3>Total</h3>
                <h2 id="total">0</h2>
            </div>

            <div class="card">
                <h3>Approved</h3>
                <h2 id="approved">0</h2>
            </div>

            <div class="card">
                <h3>Verified</h3>
                <h2 id="verified">0</h2>
            </div>

            <div class="card">
                <h3>Submitted</h3>
                <h2 id="submitted">0</h2>
            </div>

        </div>

        <div class="controls">

            <input
                type="text"
                id="search"
                placeholder="Search student..."
            >

            <select id="statusFilter">
                <option value="">All Status</option>
                <option value="Submitted">Submitted</option>
                <option value="Verified">Verified</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
            </select>

        </div>

        <p id="count"></p>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Student Name</th>
                    <th>Department</th>
                    <th>Scholarship</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Applied Date</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="tableBody">
                <!-- Data will be loaded here -->
            </tbody>

        </table>

        <hr>

        <h2>Scholarship Assistant</h2>

        <div class="assistant">

            <input
                type="text"
                id="question"
                placeholder="Ask a question..."
            >

            <button onclick="askAssistant()">
                Ask
            </button>

        </div>

        <p id="answer"></p>

    </div>

    <script src="../js/script.js"></script>

</body>
<footer>

Scholarship Tracker © 2026

</footer>
</html>
