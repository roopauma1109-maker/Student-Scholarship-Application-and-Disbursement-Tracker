<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Scholarship</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">

    <h1>Apply Scholarship</h1>

    <div class="card">

        <p><strong>Student:</strong> <span id="studentName"></span></p>

        <label for="scholarship">Select Scholarship</label>
        <br><br>

        <select id="scholarship">
            <option value="">-- Select Scholarship --</option>
            <option value="1">Merit Scholarship</option>
            <option value="2">Sports Scholarship</option>
            <option value="3">Minority Scholarship</option>
            <option value="4">SC/ST Scholarship</option>
        </select>

        <br><br>

        <button type="button" onclick="applyScholarship()">
            Submit
        </button>

        <p id="message"></p>

    </div>

</div>

<script src="../js/apply.js"></script>

</body>
</html>
