<!DOCTYPE html>
<html lang="en">
<head>

    <title>Student Login</title>

</head>
<body>

<div class="container">

    <h1>🎓 Student Login</h1>

    </div>

</div>

<script src="../js/student-login.js"></script>

</body>
</html>
